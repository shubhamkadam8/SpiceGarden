<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Spice Garden - Admin Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #111;

            color: white;

            font-family: Arial, sans-serif;

            padding: 20px;
        }


        .login-box {

            width: 100%;

            max-width: 400px;

            background: #222;

            padding: 35px;

            border-radius: 14px;
        }


        h1 {

            margin-bottom: 10px;

            text-align: center;
        }


        .description {

            text-align: center;

            opacity: 0.6;

            margin-bottom: 30px;
        }


        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: none;

            border-radius: 6px;

            background: #333;

            color: white;

            font-size: 16px;
        }


        input:focus {

            outline: 2px solid #555;
        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 6px;

            background: white;

            color: black;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            opacity: 0.8;
        }


        #loginMessage {

            margin-top: 20px;

            text-align: center;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="login-box">

    <h1>
        Spice Garden
    </h1>

    <p class="description">
        Admin Login
    </p>


    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p id="loginMessage"></p>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const username =
                document.getElementById(
                    "username"
                ).value;


            const password =
                document.getElementById(
                    "password"
                ).value;


            const message =
                document.getElementById(
                    "loginMessage"
                );


            message.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        "/admin/login",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username:
                                        username,

                                    password:
                                        password
                                })

                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.detail ||
                        "Login failed"
                    );

                }


                localStorage.setItem(
                    "admin_token",
                    result.access_token
                );


                window.location.href =
                    "/admin";


            }
            catch (error) {

                message.textContent =
                    error.message;

            }

        }
    );

</script>


</body>

</html>
